services:
  x-ros-service: &ros-service
    build:
      context: .
      dockerfile: ./docker/Dockerfile.gazebo
    network_mode: "host"
    privileged: true
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_SESSION_CONFIG_URI=/root/config/client.yaml
      - RUST_LOG=zenoh=fatal,zenoh_transport=fatal
    volumes:
      - ./config/client_config.yaml:/root/config/client.yaml
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/root/ros2_ws/src
      - ./config/realsense_params.yaml:/root/ros2_ws/install/pi_control/share/pi_control/config/realsense_params.yaml

  zenoh-bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    container_name: zenoh-bridge
    command: zenohd
    network_mode: "host"
    restart: unless-stopped

  pi_control:
    <<: *ros-service
    depends_on:
      - zenoh-bridge
    build:
      context: .
      dockerfile: ./docker/Dockerfile.pi
    image: hexbot_pi_ros_img:latest
    container_name: pi_control
    privileged: true 
      

  gazebo:
    <<: *ros-service # Inherit common properties
    container_name: gazebo
    depends_on:
      - zenoh-bridge
    # environment:
    #   - RUST_LOG=zenoh=fatal,zenoh_transport=fatal
    command: tail -f /dev/null

  rviz:
    <<: *ros-service # Inherit common properties
    container_name: rviz
    depends_on:
      - gazebo
    command: tail -f /dev/null

  command:
    <<: *ros-service # Inherit common properties
    build:
      context: .
      dockerfile: ./docker/Dockerfile.wsl
    container_name: command
    depends_on:
      - gazebo
    command: tail -f /dev/null